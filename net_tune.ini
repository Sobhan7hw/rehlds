; ============================================================
;  [NT] NetTune 1.7 - smart connection tuner
;  Author: FaTaL-[Hit] - https://t.me/Neo_Norm
;  Hot-reload: edits apply within ~2 seconds, no restart.
; ============================================================

; ---------------- Console banner ----------------
; 1 = short ReAuthCheck-style banner only (recommended)
; 0 = also print the Detail line (smoothing/guard state)
quiet = 1

; ---------------- Server cvars (negative = do not touch) ----------------
enforce_cvars = 1
sv_maxrate = 100000
sv_minrate = 25000
sv_maxupdaterate = 101
sv_minupdaterate = 30

; ---------------- Client push (only these 4 + cl_lc/cl_lw once) ----------------
client_enforce = 1
cl_rate = 100000
force_cl_lw = 1
force_cl_lc = 1
apply_delay = 3.0

; ---------------- Settings guard ----------------
; Pushes back manual changes of rate/cl_updaterate/cl_cmdrate/ex_interp.
; The registry API (registerHook vs addHook) is auto-detected at compile
; time from your ReHLDS headers - no extra flags are needed.
guard = 1
guard_cooldown = 5.0
guard_interval = 3.0
recheck_minutes = 1.0

; ---------------- Auto tune ----------------
auto_tune = 1
start_tier = 0
learn_seconds = 15
worsen_seconds = 6
improve_seconds = 10
min_change_interval = 15
apply_defer_max = 15
emergency_loss = 15
remember_seconds = 1800

; ---------------- Tier profiles (0=good line ... 3=bad line) ----------------
; t<N>_updaterate / t<N>_cmdrate / t<N>_interp_ratio
; ex_interp is computed as interp_ratio / updaterate (engine-correct value).
t0_updaterate = 101
t0_cmdrate = 101
t0_interp_ratio = 1.0

t1_updaterate = 101
t1_cmdrate = 101
t1_interp_ratio = 1.5

t2_updaterate = 90
t2_cmdrate = 101
t2_interp_ratio = 2.0

t3_updaterate = 70
t3_cmdrate = 80
t3_interp_ratio = 2.5

; ---------------- Tier thresholds (tier 0..2; worse => tier 3) ----------------
t0_max_loss = 0.5
t0_max_jitter = 5.0
t0_max_spike = 25.0

t1_max_loss = 2.0
t1_max_jitter = 12.0
t1_max_spike = 50.0

t2_max_loss = 5.0
t2_max_jitter = 25.0
t2_max_spike = 90.0

; ---------------- Scoreboard ping smoothing (display only) ----------------
; Needs a build with -DNT_HAVE_REHLDS=1 + matching SDK headers.
smooth_ping = 1
smooth_seconds = 6.0
smooth_deadband = 3.0
smooth_max_dev = 8.0

; ---------------- High-ping kick (0 = off) ----------------
max_ping = 0
max_ping_seconds = 20
ping_grace = 30

; ---------------- Diagnostics ----------------
; 1 = per-player tier/ping summary in console every 10s
debug = 0

; =============================================
; ScreenCatch 1.0 - config
; مسیر: cstrike/addons/screen_catch/screencatch.ini
; (hot reload: هر ۲ ثانیه چک می‌شه، ریستارت لازم نیست)
; =============================================

; روشن/خاموش کلی پلاگین
enabled = 1

; چه نوع پیام‌هایی از صفحه بازیکن شکار شه
catch_saytext = 1   ; چت + hud_saytext + منو + بیشتر متن‌های چیت
catch_textmsg = 1   ; پیام بالای وسط صفحه (pickup ها و...)
catch_hudtext = 1   ; متن وسط صفحه (شروع/ پایان راند و...)
catch_hudmsg  = 1   ; HUD پیام موقعیت‌دار رنگی (پنل‌های ESP/Radar)
catch_status  = 1   ; StatusText / StatusValue
catch_score   = 0   ; ردیف‌های اسکوربورد (پر سر و صدا، خاموش پیش‌فرض)

; هشدارهای SUSPECT در کنسول سرور هم چاپ بشه
relay_console = 1

; هشدار خودکار به ادمین‌ها وقتی چیزی مشکوک دیده شد
alert_suspect = 1

; آستانه flood: چند پیام HUD در ثانیه برای یک بازیکن = مشکوک
flood_per_sec = 8

; تعداد خط تاریخچه نگه‌داشته‌شده برای هر بازیکن (sc_shot از همین‌جا عکس می‌گیره)
hist_lines = 48

; پوشه لاگ (نسبی به پوشه cstrike)
logdir = logs/screencatch

; استیم‌آی‌دی ادمین‌ها که هشدارهای SUSPECT برایشان ارسال می‌شود
; (برای sc_watch لازم نیست ادمین باشید در این لیست؛ فقط برای دریافت هشدارها)
admin_steamid = STEAM_ID_1
admin_steamid = STEAM_ID_2

; =============================================
; دستورهای ادمین (کنسول/RCON یا تایپ در چت):
;   sc_watch <name|#userid|slot>   فید زنده صفحه یک بازیکن
;   sc_unwatch                     قطع فید
;   sc_shot  <name|#userid|slot>   اسکرین‌شات: آخرین خطوط روی صفحه او
;   sc_dump  <name|#userid|slot>   کل تاریخچه اخیر
;   sc_list / sc_stats / sc_on / sc_off
; =============================================

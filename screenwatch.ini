; ============================================================
;  [SW] ScreenWatch 1.1 - server config (by FaTaL-[Hit])
;  Hot reload every ~2 seconds.
; ============================================================

; Request a scan automatically when a player's client module reports ready
scan_on_join = 1

; Periodic sweep for everyone who has the module, seconds. 0 = off (manual only)
interval_sec = 0

; Maximum accepted screenshot size in KB (reject bigger requests)
max_shot_kb = 900

; Where screenshots are saved (relative to the HLDS directory)
save_dir = cstrike/screenwatch

; Substrings matched against window titles/classes and process names (';' separated).
; A match is evidence for manual review only, never an automatic ban.
watchlist = aimbot;wallhack;esp;overlay;d3dhook;injector;trainer;cheat

; 1 = print module status / request log to server console
debug = 1

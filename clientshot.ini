; ============================================================
;  [CSH] ClientShot 1.0 - server config
;  Hot reload every ~2 seconds. See header of clientshot_server.cpp
;  for architecture + legal warnings (DISCLOSE TO PLAYERS!).
; ============================================================

; send HWID+process-list automatically when someone connects
auto_scan_on_join = 1

; periodic full scan (screenshot + procs) for everyone; 0 disables
interval_sec = 300

; comma-separated substrings checked against the process list (lowercase!)
watchlist = cheat,hack,wallhack,aimbot,esp,trainer,wgleak,sensui,protest,artemis,evolution,xigncode,knights,infinite,cheatengine,memory

; screenshots arrive as 8-bit BMP chunks; reject bigger than this (KB)
max_shot_kb = 800

; where the server saves received BMP files (created automatically)
save_dir = cstrike/clientshot

; 1 = log requests/timeouts/module-presence to console
debug = 1

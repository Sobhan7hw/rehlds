; ============================================================
;  [SF] ShotFix 1.5
;  This file is optional. Changes are applied automatically
;  (no server restart needed).
; ============================================================

; ---------------- Bullet spread ----------------
; 1.0 = vanilla spread, 0.6 = 40% less spread, 0.0 = every bullet goes exactly
; where the crosshair points. Recommended range: 0.5 to 0.7
spread_scale = 0.6
; Same as above, only for shotguns (M3, XM1014). Lower = tighter pellet pattern
shotgun_scale = 0.85

; ---------------- Recoil ----------------
; Multiplier for every NEW recoil kick (view punch). 1.0 = vanilla, 0.0 = none.
; Only fresh upward kicks are scaled; natural decay is untouched.
recoil_scale = 0.8

; How much of the current recoil the BULLET reference direction follows.
; 1.0 = EXACTLY like vanilla CS 1.6 (bullets cone around v_angle+punchangle,
; which is where your crosshair visually points). KEEP AT 1.0.
; Values below 1.0 make bullets land BELOW the visible crosshair while spraying
; and were the cause of the "shots feel like lag" reports - do not lower unless
; you really know what you are doing. (0.0 to 1.0)
punch_aim = 1.0

; ---------------- Targeting / filters ----------------
; 1 = bots are affected too, 0 = real players only
apply_to_bots = 1
; Traces shorter than this (units) are never treated as bullets.
; Hard floor 4096 in v1.5: real bullets trace at RANGE=8192; knife hulls,
; tracers and AMXX hitscan checks are much shorter and must never be touched.
min_trace_len = 4096
; Max angle (degrees) between a bullet trace and the aim axis
; (v_angle + punchangle*punch_aim) that still counts as a weapon spread cone.
; With the correct reference, rifle spread never exceeds ~4.7 deg, so the
; default 10 has plenty of headroom and clips nothing real. Shotguns
; automatically get 3x this window (30 deg). (2 to 30)
max_spread_deg = 10
; NOTE: require_attack is DEPRECATED and ignored by the plugin. pev->button is
; already cleared before weapon fire inside player post-think, so an attack
; gate could never work reliably. Detection is purely geometric.
require_attack = 0

; ---------------- Troubleshooting ----------------
; 1 = print counters to the server console every 3 seconds (only when something changed)
debug = 1

; ---------------- Hit registration (server cvars) ----------------
; 1 = the plugin keeps these cvars at the values below (also after map change)
; and restores the original values when it is unloaded
enforce_cvars = 1
; A negative value (-1) means: do not touch this cvar
unlag = 1
maxunlag = 0.5
unlagpush = 0
unlagsamples = 1
; Player hitbox scale for traces. -1 = leave as is. Try 1.5 and go up step by step.
clienttrace = -1
